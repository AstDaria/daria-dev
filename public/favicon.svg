<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rays from center, varying lengths -->
  <line x1="16" y1="16" x2="16" y2="4"    stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="25" y2="7"    stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="28" y2="16"   stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="23" y2="25"   stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="16" y2="26"   stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="8"  y2="27"   stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="4"  y2="16"   stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="16" y1="16" x2="9"  y2="8"    stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Circles at ray ends -->
  <circle cx="16"  cy="4"  r="2.4" fill="#a78bfa"/>
  <circle cx="25"  cy="7"  r="2"   fill="#60a5fa"/>
  <circle cx="28"  cy="16" r="1.8" fill="#34d399"/>
  <circle cx="23"  cy="25" r="2.2" fill="#a78bfa"/>
  <circle cx="16"  cy="26" r="1.6" fill="#60a5fa"/>
  <circle cx="8"   cy="27" r="2"   fill="#34d399"/>
  <circle cx="4"   cy="16" r="2.4" fill="#a78bfa"/>
  <circle cx="9"   cy="8"  r="1.8" fill="#60a5fa"/>
</svg>
